<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CM Fast Capture</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#fff}button{border:0;cursor:pointer;font-weight:750}#home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}#start{font-size:22px;padding:24px 30px;background:#1676ef;color:#fff;border-radius:18px;width:min(100%,420px)}#cameraScreen{display:none;position:fixed;inset:0;background:#000}#cameraScreen.active{display:flex;flex-direction:column}#preview{flex:1;position:relative;min-height:0;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}#flash.on{opacity:.45;transition:opacity .12s}#captureBar{height:118px;flex:none;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}#capture{width:82px;height:82px;border-radius:50%;background:#fff;border:8px solid #4b9bff;box-shadow:0 0 0 3px white}#capture:disabled{opacity:.5}#message{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:22px;background:#151b24dd;color:#fff;font-size:14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .25s}#message.show{opacity:1}#status{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px;color:#fff;background:#111a24cc;border-radius:12px;padding:9px 10px;pointer-events:none}#status span{white-space:nowrap}#config{display:none}#config input{width:100%}
</style></head><body><main id="home"><button id="start">Bắt đầu chụp ảnh</button></main><section id="cameraScreen"><div id="preview"><video id="video" autoplay muted playsinline></video><div id="flash"></div><div id="message" role="status" aria-live="polite"></div><div id="status" role="status"><span>Đã chụp: <b id="captured">0</b></span><span>Chờ gửi: <b id="queued">0</b></span><span id="syncState">Chưa kết nối</span></div></div><div id="captureBar"><button id="capture" aria-label="Chụp ảnh" disabled></button></div></section><div id="config"><input id="endpoint"><input id="secret"><span id="pending"></span><span id="sent"></span><span id="sending"></span></div><script>
'use strict';
const $=id=>document.getElementById(id);let stream=null,front=false,busy=false,uploading=false,db=null,sent=0,captured=0;let endpoint=localStorage.getItem('cm_endpoint')||'',secret=sessionStorage.getItem('cm_secret')||'';let noticeTimer; 
function notice(s){const el=$('message');el.textContent=s;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('cm-fast-capture-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function transact(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('queue',mode),s=t.objectStore('queue');let req=fn(s);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);t.onerror=()=>reject(t.error)})}
async function items(){return transact('readonly',s=>s.getAll())}async function put(v){return transact('readwrite',s=>s.put(v))}async function del(id){return transact('readwrite',s=>s.delete(id))}
async function updateCount(){const a=await items();$('pending').textContent=a.length;$('sent').textContent=sent;$('queued').textContent=a.length;$('captured').textContent=captured;$('syncState').textContent=uploading?'Đang gửi…':(a.length?'Đang chờ đồng bộ':'Đã đồng bộ')}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:front?'user':'environment',width:{ideal:1920},height:{ideal:2560}}});$('video').srcObject=stream;await $('video').play();$('capture').disabled=false;notice('Sẵn sàng chụp')}catch(e){notice('Không mở được camera: '+e.message)}}
function stamp(d){const f=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${f(d.getMonth()+1)}.${f(d.getDate())}_${f(d.getHours())}.${f(d.getMinutes())}.${f(d.getSeconds())}`}
function blobJPEG(canvas,q){return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q))}
async function compress(){const v=$('video'),w=v.videoWidth,h=v.videoHeight;if(!w||!h)throw Error('Camera chưa sẵn sàng');const canvas=document.createElement('canvas');const max=1920,scale=Math.min(1,max/Math.max(w,h));canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);let blob=await blobJPEG(canvas,.76);if(!blob)throw Error('Không nén được ảnh');return blob}
async function capture(){if(busy||!db)return;busy=true;$('capture').disabled=true;try{const when=new Date(),id=crypto.randomUUID();const blob=await compress();await put({id,stamp:stamp(when),blob,created:Date.now()});captured++;$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),110);notice('✓ Đã lưu ảnh vào hàng đợi');await updateCount();sync()}catch(e){notice('Lỗi lưu ảnh: '+e.message)}finally{busy=false;$('capture').disabled=false}}
function toBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function receipt(id){return new Promise(resolve=>{const cb='cmReceipt'+Math.random().toString(36).slice(2);const s=document.createElement('script');let finished=false;const timer=setTimeout(()=>finish(false),12000);function finish(ok){if(finished)return;finished=true;clearTimeout(timer);delete window[cb];s.remove();resolve(ok)}window[cb]=data=>finish(Boolean(data&&data.ok));s.onerror=()=>finish(false);s.src=endpoint+'?id='+encodeURIComponent(id)+'&callback='+cb+'&t='+Date.now();document.head.appendChild(s)})}
async function upload(row){const body=new URLSearchParams({secret,id:row.id,stamp:row.stamp,mime:'image/jpeg',data:await toBase64(row.blob)});await fetch(endpoint,{method:'POST',mode:'no-cors',body,redirect:'follow'}); // opaque response: NOT proof of success
for(let i=0;i<4;i++){if(await receipt(row.id))return true;await new Promise(r=>setTimeout(r,1500*(i+1)))}return false}
async function sync(){if(uploading||!db||!endpoint||!secret||!navigator.onLine)return;uploading=true;$('sending').textContent='1';$('syncState').textContent='Đang gửi…';try{const queue=(await items()).sort((a,b)=>a.created-b.created);for(const row of queue){if(!navigator.onLine)break;try{if(await receipt(row.id)||await upload(row)){await del(row.id);sent++;notice('✓ Đã đồng bộ '+row.stamp);await updateCount()}else{notice('Đang chờ xác nhận Drive; sẽ thử lại');break}}catch(e){notice('Chưa đồng bộ: '+e.message);break}}}finally{$('sending').textContent='0';uploading=false;await updateCount()}}
$('start').onclick=async()=>{if(!endpoint){const url=prompt('Nhập URL Google Apps Script /exec (chỉ lần đầu):','');if(!url)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url.trim())){alert('URL Apps Script /exec không hợp lệ');return}endpoint=url.trim();localStorage.setItem('cm_endpoint',endpoint)}if(!secret){const pass=prompt('Nhập mật khẩu upload để đồng bộ Google Drive:','');if(!pass)return;secret=pass;sessionStorage.setItem('cm_secret',secret)}$('home').style.display='none';$('cameraScreen').classList.add('active');await startCamera();sync()};$('capture').onclick=capture;window.addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(sync,20000);openDb().then(x=>{db=x;updateCount();sync()}).catch(e=>notice('Không thể mở IndexedDB: '+e.message));
</script></body></html>
